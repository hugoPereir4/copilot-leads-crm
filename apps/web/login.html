<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color" name="theme-color" content="#F7FAF8">
  <title>Copilot Leads · Entrar</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css">
  <link rel="stylesheet" href="/assets/styles/global.css">
  <link rel="stylesheet" href="/assets/styles/layout.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <link rel="stylesheet" href="/assets/styles/login.css">
  <script>
    (() => {
      let theme;
      try {
        const savedTheme = localStorage.getItem("copilot-leads-theme");
        if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      } catch {
        // The system preference remains available when storage is disabled.
      }
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.getElementById("theme-color").content = theme === "dark" ? "#141F1C" : "#F7FAF8";
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="header-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-copy">
          <span class="brand-name">Copilot Leads</span>
          <span class="brand-caption">Atendimento em um só lugar</span>
        </span>
      </span>
    </div>
  </header>

  <main id="main-content" class="login-layout">
    <section class="panel login-panel" aria-labelledby="login-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ACESSO DOS ATENDENTES</p>
          <h1 id="login-title">Entrar no painel</h1>
          <p class="muted">Use o usuário e a senha criados pelo administrador.</p>
        </div>
      </div>
      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
            spellcheck="false" required maxlength="32">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <div class="actions">
          <button id="login-submit" class="button button-primary" type="submit">Entrar</button>
        </div>
      </form>
      <p id="login-error" class="action-status" role="alert" aria-live="assertive"></p>
    </section>
  </main>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
